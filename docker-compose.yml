services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_workspace}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge_app} -d ${POSTGRES_DB:-knowledge_workspace}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

